<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <title>CodexBar — usage stats for OpenAI Codex and Claude Code, without having to login</title>
  <desc>A dark GitHub-style social card with a menubar pill and tiny usage chart.</desc>
  <rect width="1600" height="900" fill="#0d1117"/>
  <rect x="56" y="56" width="1488" height="788" rx="28" fill="#161b22" stroke="#30363d" stroke-width="2"/>
  <path d="M56 156H1544" stroke="#30363d" stroke-width="2"/>
  <circle cx="102" cy="106" r="8" fill="#ff7b72"/><circle cx="130" cy="106" r="8" fill="#d29922"/><circle cx="158" cy="106" r="8" fill="#3fb950"/>
  <text x="205" y="115" fill="#8b949e" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="22" letter-spacing="2">CHRIS COVERIES / MENU BAR TOOL</text>
  <g font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif">
    <text x="126" y="310" fill="#8b949e" font-size="22" letter-spacing="4">YOUR USAGE, AT A GLANCE</text>
    <text x="120" y="416" fill="#f0f6fc" font-size="88" font-weight="700" letter-spacing="-3">CodexBar</text>
    <text x="124" y="482" fill="#8b949e" font-size="21">usage stats for OpenAI Codex and Claude Code, without having to login</text>
    <rect x="124" y="554" width="214" height="5" rx="3" fill="#3fb950"/>
    <text x="124" y="620" fill="#8b949e" font-size="21" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace">private · local · instant</text>
  </g>

  <g transform="translate(845 220)">
    <rect x="0" y="0" width="602" height="420" rx="26" fill="#0d1117" stroke="#30363d" stroke-width="2"/>
    <text x="36" y="48" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16" letter-spacing="2">MENUBAR / LIVE USAGE</text>
    <rect x="36" y="76" width="530" height="84" rx="42" fill="#161b22" stroke="#3fb950" stroke-width="3"/>
    <circle cx="76" cy="118" r="13" fill="#3fb950"/>
    <path d="M70 118h12M76 112v12" stroke="#0d1117" stroke-width="3" stroke-linecap="round"/>
    <text x="107" y="112" fill="#f0f6fc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="23" font-weight="600">Codex</text>
    <text x="107" y="138" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="16">72% remaining</text>
    <g transform="translate(378 98)" fill="#3fb950">
      <rect x="0" y="24" width="12" height="20" rx="3"/><rect x="20" y="15" width="12" height="29" rx="3"/><rect x="40" y="4" width="12" height="40" rx="3"/><rect x="60" y="20" width="12" height="24" rx="3"/>
    </g>
    <rect x="36" y="191" width="530" height="178" rx="18" fill="#161b22" stroke="#21262d" stroke-width="2"/>
    <text x="64" y="230" fill="#f0f6fc" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="21">Today</text>
    <text x="64" y="258" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="15">requests by provider</text>
    <path d="M64 332H536" stroke="#30363d" stroke-width="2"/>
    <g fill="#3fb950">
      <rect x="92" y="286" width="42" height="46" rx="5"/><rect x="174" y="264" width="42" height="68" rx="5"/><rect x="256" y="298" width="42" height="34" rx="5"/><rect x="338" y="244" width="42" height="88" rx="5"/><rect x="420" y="276" width="42" height="56" rx="5"/>
    </g>
    <g fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="14" text-anchor="middle"><text x="113" y="354">08</text><text x="195" y="354">10</text><text x="277" y="354">12</text><text x="359" y="354">14</text><text x="441" y="354">16</text></g>
  </g>
  <text x="120" y="790" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="18" letter-spacing="1">CODEXBAR / SEE THE SIGNAL, SKIP THE LOGIN</text>
